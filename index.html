<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Traders - Owner Setup Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-emerald-50 via-slate-50 to-emerald-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- SETUP FORM CONTAINER -->
    <div id="setupContainer" class="bg-white w-full max-w-md rounded-3xl p-7 shadow-2xl border border-emerald-200">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-emerald-700 via-emerald-600 to-teal-500 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2 shadow-xl shadow-emerald-600/30">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">India Traders</h2>
            <p class="text-xs font-semibold text-emerald-600 uppercase tracking-widest mt-0.5">Owner Setup & Logo Portal</p>
        </div>

        <form id="setupForm" class="space-y-4">
            <!-- LOGO / PROFILE PICTURE UPLOAD -->
            <div class="flex flex-col items-center justify-center mb-2">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Company Logo / Profile Photo</label>
                <div class="relative w-20 h-20 rounded-full border-2 border-dashed border-emerald-400 bg-emerald-50 flex items-center justify-center overflow-hidden cursor-pointer hover:bg-emerald-100 transition shadow-inner">
                    <img id="logoPreview" src="" alt="Logo Preview" class="w-full h-full object-cover hidden">
                    <div id="logoPlaceholder" class="text-center text-emerald-600">
                        <i class="fa-solid fa-camera text-xl"></i>
                        <span class="block text-[9px] font-bold mt-1">Upload</span>
                    </div>
                    <input type="file" id="logoFileInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewLogo(event)">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Owner ka Naam</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="userNameInput" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="Apna pura naam likhein">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="userPhoneInput" required maxlength="10" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white focus:outline-none transition" placeholder="10-digit mobile number">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 via-emerald-700 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 text-sm transition flex items-center justify-center">
                <span>App Shuru Karein</span> <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>
    </div>

    <!-- SPLASH SCREEN WITH LOGO (Initially Hidden) -->
    <div id="splashScreen" class="fixed inset-0 bg-gradient-to-br from-emerald-800 via-teal-800 to-slate-900 z-50 flex flex-col items-center justify-center p-4 text-white hidden">
        <div class="text-center space-y-4 animate-pulse">
            <div class="w-28 h-28 bg-white rounded-3xl mx-auto flex items-center justify-center shadow-2xl p-2 border-4 border-emerald-400/40 overflow-hidden">
                <img id="splashLogoImg" src="" alt="Logo" class="w-full h-full object-contain" onerror="this.src='Logo.jpg'">
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-wider">INDIA TRADERS</h1>
                <p class="text-xs text-emerald-200 font-semibold uppercase tracking-widest mt-1">Poultry Wholesale Management</p>
            </div>
            <div class="pt-6">
                <div class="w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-[11px] text-emerald-300 mt-2 font-medium">Loading Dashboard...</p>
            </div>
        </div>
    </div>

    <script>
        let uploadedLogoBase64 = "";

        // Check agar pehle se setup ho rakha hai toh seedhe splash screen dikha kar dashboard par bhej dein
        window.onload = function() {
            const savedData = localStorage.getItem('indiaTradersConfig');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                if (parsed.logo) {
                    document.getElementById('splashLogoImg').src = parsed.logo;
                }
                showSplashScreenAndRedirect();
            }
        };

        function previewLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedLogoBase64 = e.target.result;
                    const preview = document.getElementById('logoPreview');
                    preview.src = uploadedLogoBase64;
                    preview.classList.remove('hidden');
                    document.getElementById('logoPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('userNameInput').value.trim();
            const phone = document.getElementById('userPhoneInput').value.trim();
            
            const userData = { 
                role: 'owner', 
                name, 
                phone, 
                logo: uploadedLogoBase64 || '',
                activated: true 
            };
            
            localStorage.setItem('indiaTradersConfig', JSON.stringify(userData));

            if (uploadedLogoBase64) {
                document.getElementById('splashLogoImg').src = uploadedLogoBase64;
            }

            showSplashScreenAndRedirect();
        });

        function showSplashScreenAndRedirect() {
            document.getElementById('setupContainer').classList.add('hidden');
            document.getElementById('splashScreen').classList.remove('hidden');

            // 2.5 seconds ke baad dashboard.html par redirect ho jayega[cite: 21]
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2500);
        }
    </script>
</body>
</html>
